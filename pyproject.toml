[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Keep linting minimal and focused on correctness; expand as needed.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
